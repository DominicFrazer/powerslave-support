<!DOCTYPE html>
<!--
  Source for images/og-default.png — the social preview card, 1200×630.

  Not served to anyone; it exists so the card can be regenerated instead of
  re-drawn.

  The logo is a vector with a transparent ground, so it needs no blend tricks and
  sits on the site's own accent glow without fighting it — its gradient IS the
  brand gradient. Keep the palette here in step with :root in style.css.

  Render from the repo root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=images/og-default.png tools/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PowerSlave Developments — social card</title>
<style>
  * { box-sizing: border-box; margin: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(900px 520px at 20% -20%, rgba(108, 140, 255, 0.26), transparent 62%),
      radial-gradient(720px 460px at 94% 116%, rgba(160, 108, 255, 0.20), transparent 60%),
      #0b0d12;
    color: #e7e9ee;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 74px 88px 78px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .logo {
    width: 680px;
    height: auto;
    display: block;
  }

  h1 {
    max-width: 24ch;
    font-size: 66px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    font-weight: 700;
    color: #eef1f7;
  }

  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 32px;
    padding-top: 28px;
    border-top: 1px solid #23262e;
  }
  .foot p {
    max-width: 62ch;
    color: #98a1b0;
    font-size: 22px;
    line-height: 1.45;
  }
  .foot .url {
    flex: 0 0 auto;
    color: #e7e9ee;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <img class="logo" src="../images/logo-powerslave.svg"
       alt="PowerSlave" width="1495" height="170">

  <h1>Turning ideas into reality.</h1>

  <div class="foot">
    <p>Senior engineering consultancy. We advise, architect and lead, as well as build.</p>
    <span class="url">powerslave.dev</span>
  </div>

</body>
</html>
